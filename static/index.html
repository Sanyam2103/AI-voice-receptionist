<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maple Street Dog Grooming</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #243026; background: #f4efe6; }
      body { margin: 0; display: grid; min-height: 100vh; place-items: center; }
      main { width: min(680px, 92vw); }
      h1 { font-size: 1.6rem; }
      #messages { height: 55vh; overflow-y: auto; padding: 1rem; border-radius: 12px;
        background: white; box-shadow: 0 8px 30px #24302618; }
      .message { margin: .75rem 0; padding: .7rem .9rem; border-radius: 10px; white-space: pre-wrap; }
      .user { margin-left: 20%; background: #dcebd8; }
      .assistant { margin-right: 20%; background: #f2f2f2; }
      form { display: flex; gap: .5rem; margin-top: .75rem; }
      input { flex: 1; padding: .8rem; border: 1px solid #a8afa8; border-radius: 8px; font: inherit; }
      button { border: 0; border-radius: 8px; padding: .8rem 1.1rem; background: #315b3b;
        color: white; font: inherit; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
    </style>
  </head>
  <body>
    <main>
      <h1>Maple Street Dog Grooming</h1>
      <div id="messages" aria-live="polite">
        <div class="message assistant">Hi! How can I help with your dog’s grooming appointment?</div>
      </div>
      <form id="chat-form">
        <input id="message" aria-label="Message" autocomplete="off" maxlength="4000"
          placeholder="Ask about services or an appointment…" required>
        <button type="submit">Send</button>
      </form>
    </main>
    <script>
      const form = document.querySelector("#chat-form");
      const input = document.querySelector("#message");
      const button = form.querySelector("button");
      const messages = document.querySelector("#messages");
      let sessionId = sessionStorage.getItem("grooming-session");

      function addMessage(text, role) {
        const element = document.createElement("div");
        element.className = `message ${role}`;
        element.textContent = text;
        messages.appendChild(element);
        messages.scrollTop = messages.scrollHeight;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        addMessage(message, "user");
        input.value = "";
        button.disabled = true;
        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message, session_id: sessionId})
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "Request failed");
          sessionId = data.session_id;
          sessionStorage.setItem("grooming-session", sessionId);
          addMessage(data.message, "assistant");
        } catch (error) {
          addMessage("The assistant is unavailable. Please contact the shop for help.", "assistant");
        } finally {
          button.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
